org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Release를 디버그 키로 서명 (기기 직접 설치·내부 테스트용). Google Play 업로드는 업로드 키 필요 → 이 줄 비우거나 false 유지.
# android.signReleaseWithDebug=true
android.useAndroidX=true
android.enableJetifier=true
# R8 full mode strips generic type info used by flutter_local_notifications (GSON TypeToken), causing "Missing type parameter" in zonedSchedule
android.enableR8.fullMode=false
gradle.user.home=/home/user/.gradle
org.gradle.caching=true
